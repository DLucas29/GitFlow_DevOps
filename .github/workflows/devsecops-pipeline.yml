name: Secure Pipeline CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  sast_semgrep:
    name: 1. SAST - Semgrep Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Executar Semgrep com Validação
        run: |
          semgrep scan --config=auto --sarif -o semgrep-results.sarif .

      - name: Salvar Relatório SAST
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-sast-semgrep
          path: semgrep-results.sarif

  dast_owasp_zap:
    name: 2. DAST - OWASP ZAP Scan
    runs-on: ubuntu-latest
    needs: sast_semgrep
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Iniciar aplicação localmente
        run: |
          npm install
          nohup npm start > app.log 2>&1 &
          npx wait-on http://localhost:3000/api/status -t 15000

      - name: Executar OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
          fail_action: false
          allow_issue_writing: false

      - name: Salvar Relatório DAST
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-dast-zap
          path: report_html.html

  deploy_visual:
    name: 3. Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: [sast_semgrep, dast_owasp_zap]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar pasta public/
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Publicar página atualizada
        id: deployment
        uses: actions/deploy-pages@v4