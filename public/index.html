<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevSecOps - GitFlow</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem;

      max-width: 450px;
      border-top: 6px solid #38bdf8;

    .badge {
      display: inline-block;
      background: #0284c7;
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 1rem;

    h1 { margin: 0.5rem 0; font-size: 1.8rem; }
    p { color: #cbd5e1; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Landing Page</span>
    <h1>Pipeline DevSecOps Ativa</h1>
    <p>Este site foi validado por <strong>SAST (Semgrep)</strong> e <strong>DAST (OWASP ZAP)</strong> antes de ser publicado.</p>
  </div>
